# Inherits the workspace root options, including its `plugins` section (see
# packages/flutter_constraint_layout_lints). Analyzer plugins may only be configured in
# the root options file of a workspace, so this file must not declare its own.
include: ../../analysis_options.yaml

formatter:
  trailing_commas: preserve
analyzer:
  exclude:
    - build/**
    # The parity tooling's Flutter harness is a package of its own
    # (cl_fl_harness), set up outside the repository by its setup.sh: its
    # imports resolve only there, so it is not analyzed as part of this one.
    - tool/parity/fl_harness/**
