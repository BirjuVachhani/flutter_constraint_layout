name: constraint_layout_lints
description: >-
  Analyzer plugin with lint rules for the constraint_layout Flutter package.
  Catches constraint mistakes that only show up at runtime, such as two
  Constrained children sharing an id inside the same ConstraintLayout.
version: 0.1.0
publish_to: none

# Deliberately NOT a workspace member. Analyzer plugins run in their own
# isolate against an analyzer version pinned to the Dart SDK, which would
# fight the Flutter-side dependency resolution of the root workspace.

environment:
  sdk: ^3.12.0

dependencies:
  analysis_server_plugin: ^0.3.20
  analyzer: ^14.1.0

dev_dependencies:
  analyzer_testing: ^0.3.4
  lints: ^6.1.0
  test: ^1.31.2
  test_reflective_loader: ^0.4.0
