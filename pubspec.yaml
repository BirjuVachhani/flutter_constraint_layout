name: flutter_constraint_layout_workspace

description: >-
  Workspace shell for the flutter_constraint_layout monorepo. Holds no code of its own;
  it exists so a single `flutter pub get` here resolves every member against one
  shared lock file.

publish_to: none

environment:
  sdk: ^3.12.0

# Note: playground/ is a local-only scratch app excluded from VCS (see
# .gitignore). It must not be listed here, or pub get would fail on a
# fresh clone where the directory does not exist.
#
# packages/flutter_constraint_layout_lints is likewise absent on purpose: an analyzer
# plugin is resolved by the analysis server from its own path, and adding it
# here would pull the analyzer into every member's resolution.
workspace:
  - packages/constraint_engine
  - packages/flutter_constraint_layout
  - website

# Only so `include: package:flutter_lints/flutter.yaml` in this directory's
# analysis_options.yaml resolves; members inherit that file.
dev_dependencies:
  flutter_lints: ^6.0.0
