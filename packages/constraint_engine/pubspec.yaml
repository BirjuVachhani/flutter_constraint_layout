name: constraint_engine
description: >-
  A pure-Dart port of Android ConstraintLayout's layout pipeline, in Java's
  float arithmetic, giving Android's frames exactly. No Flutter dependency.
version: 1.0.0
homepage: https://constraints.birju.dev
repository: https://github.com/BirjuVachhani/flutter_constraint_layout/tree/main/packages/constraint_engine
issue_tracker: https://github.com/BirjuVachhani/flutter_constraint_layout/issues
topics:
  - layout
  - constraint-layout
  - constraints
  - cassowary
  - solver

# Resolved together with every other member from the workspace root two
# directories up.
resolution: workspace

environment:
  sdk: ^3.12.0

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
  coverage: ^1.15.1
