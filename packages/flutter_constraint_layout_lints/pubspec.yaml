name: flutter_constraint_layout_lints
description: >-
  Analyzer plugin for flutter_constraint_layout that flags duplicate and
  undefined constraint ids as you edit, before they misplace a widget.
version: 1.0.0
homepage: https://constraints.birju.dev
repository: https://github.com/BirjuVachhani/constraint_layout/tree/main/packages/flutter_constraint_layout_lints
issue_tracker: https://github.com/BirjuVachhani/constraint_layout/issues
topics:
  - lints
  - analyzer
  - analyzer-plugin
  - constraint-layout

# Deliberately NOT a workspace member. Analyzer plugins run in their own
# isolate against an analyzer version pinned to the Dart SDK, which would
# fight the Flutter-side dependency resolution of the root workspace.

environment:
  sdk: ^3.12.0

dependencies:
  analysis_server_plugin: ^0.3.20
  analyzer: ^14.1.0

dev_dependencies:
  analyzer_testing: ^0.3.4
  lints: ^6.1.0
  test: ^1.31.2
  test_reflective_loader: ^0.4.0
