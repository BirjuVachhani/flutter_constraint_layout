name: flutter_constraint_layout
description: >-
  Android's ConstraintLayout for Flutter. Position and size widgets with
  constraints in one flat layout: chains, barriers, guidelines, ratios, and more.
version: 1.0.0
homepage: https://constraints.birju.dev
repository: https://github.com/BirjuVachhani/constraint_layout/tree/main/packages/flutter_constraint_layout
issue_tracker: https://github.com/BirjuVachhani/constraint_layout/issues
documentation: https://constraints.birju.dev/docs
topics:
  - layout
  - constraint-layout
  - constraints
  - widget
  - ui

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Resolved together with every other member from the workspace root two
# directories up.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  constraint_engine: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
