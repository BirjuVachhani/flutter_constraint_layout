name: Deploy website

# Builds the showcase site (website/) with the WASM renderer and publishes it
# to GitHub Pages at https://constraints.birju.dev.
#
# With a GitHub Actions deploy, the custom domain comes from the repository's
# Pages settings (Settings > Pages > Custom domain); the CNAME file in the
# artifact is ignored. website/web/CNAME is kept in step with that setting so
# the build output stays self-describing.

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes: the site
    # itself, the two packages it renders live, and the workspace resolution.
    paths:
      - "website/**"
      - "packages/constraint_engine/**"
      - "packages/flutter_constraint_layout/**"
      - "pubspec.yaml"
      - ".github/workflows/deploy-website.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build (WASM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read access to the Pages API, for configure-pages.
      pages: read
    # A newer commit cancels an in-progress build of an older one.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that Pages is enabled
        # Before the slow steps, so a repository without a Pages site fails in
        # seconds. It does not check the source: Settings > Pages > Source must
        # be "GitHub Actions" for the deploy below to publish.
        uses: actions/configure-pages@v6

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve workspace dependencies
        # Run at the repo root so the whole pub workspace
        # (packages/constraint_engine, packages/flutter_constraint_layout,
        # website) resolves together.
        run: flutter pub get

      - name: Build website (WASM)
        # Served from the domain root, so the base href is "/". The --wasm
        # build also emits a JavaScript fallback for browsers without WasmGC.
        working-directory: website
        run: flutter build web --wasm --base-href "/"

      - name: Add static pages for path URLs
        # The site uses path URLs (/docs) and GitHub Pages has no rewrite rules:
        # it serves <path>.html for an extensionless path and 404.html for any
        # other unknown one. This writes docs.html with the docs page's own
        # title, description, and canonical URL (from page_meta.dart), so
        # crawlers and link previews that never run the app see the right
        # page, and 404.html so any other deep link still boots the app. It
        # fails if web/index.html and page_meta.dart have drifted apart. New
        # top-level routes go in staticRoutes (lib/src/seo/route_pages.dart).
        working-directory: website
        run: dart run tool/route_pages.dart build/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job holds the Pages write scope and the OIDC token.
    permissions:
      pages: write
      id-token: write
    # A deployment that is already running is never cancelled. GitHub keeps at
    # most one deployment waiting behind it, so a newer one replaces an older
    # one that is still waiting, and the site always ends on the latest build.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
