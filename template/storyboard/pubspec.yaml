name: storyboard

description: "Interactive canvas of every site_kit component, token, and page pattern."

publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # The package this storyboard documents. It re-exports go_router and the
  # shiki_flutter types its own API uses, so this is the only dependency the
  # storyboard needs beyond Flutter itself.
  site_kit:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
