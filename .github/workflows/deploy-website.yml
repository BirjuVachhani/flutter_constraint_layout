name: Deploy website

# Builds the showcase site (website/) with the WASM renderer and publishes it
# to GitHub Pages. The custom domain is preserved by website/web/CNAME, which
# `flutter build web` copies into the build output.

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes. The site
    # depends on the root package (lib/) and the engine (packages/), so those
    # count too.
    paths:
      - "website/**"
      - "lib/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-website.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Grant the token the scopes the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Cancel an in-progress run when a newer commit lands,
# but never cancel an actual deployment already talking to Pages.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match the version this repo is developed against.
          flutter-version: 3.44.6
          cache: true

      - name: Resolve workspace dependencies
        # Run at the repo root so the whole pub workspace
        # (packages/constraint_engine, packages/constraint_layout, website)
        # resolves together.
        run: flutter pub get

      - name: Build website (WASM)
        working-directory: website
        run: flutter build web --wasm --base-href "/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
